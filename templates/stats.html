{% extends "base.html" %}

{% block content %}
<h2>Статистика: {{ label }} ({{ country }})</h2>
<p><a href="{{ url_for('planes_back', country=country) }}">← К списку самолётов</a></p>

{% if total %}
<div class="card">
    <h3>{{ label }}</h3>
    <p><b>{{ count }}</b> из {{ total }} ({{ '%.1f'|format(percent) }}%)</p>
</div>
{% else %}
<p>Нет данных.</p>
{% endif %}

<p><a href="{{ url_for('planes_back', country=country) }}">← К списку самолётов</a></p>
{% endblock %}
