{% extends "base.html" %}

{% block content %}
<h2>Выберите страну</h2>
<form action="{{ url_for('planes') }}" method="post">
    <select name="country" required>
        {% for c in countries %}
            <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
    </select>
    <button type="submit">Показать самолёты</button>
</form>
{% endblock %}
